<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- =============================================
         FAVICON & ICONS
    ============================================= -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- =============================================
         VIEWPORT — Critical for mobile responsiveness
         user-scalable=no prevents iOS double-tap zoom
    ============================================= -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- =============================================
         THEME COLOR — Shown in browser UI on Android
         Change this to match your app's primary color
    ============================================= -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- =============================================
         SEO META TAGS
    ============================================= -->
    <meta name="description" content="Staff Leave Hub — Manage staff leave requests, approvals, and attendance records all in one place." />
    <meta name="keywords" content="staff leave management, leave hub, HR management, leave requests, attendance" />
    <meta name="author" content="Staff Leave Hub" />
    <meta name="robots" content="index, follow" />

    <!-- =============================================
         OPEN GRAPH — For link previews (WhatsApp,
         LinkedIn, Facebook, Slack etc.)
    ============================================= -->
    <meta property="og:title" content="Staff Leave Hub" />
    <meta property="og:description" content="Manage staff leave requests, approvals, and attendance records all in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- =============================================
         TWITTER CARD
    ============================================= -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Staff Leave Hub" />
    <meta name="twitter:description" content="Manage staff leave requests and approvals." />

    <!-- =============================================
         MANIFEST (PWA support)
    ============================================= -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- =============================================
         GOOGLE FONTS — Loads Inter for clean UI
         Add any fonts your CSS uses here
    ============================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =============================================
         PAGE TITLE
    ============================================= -->
    <title>Staff Leave Hub</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
